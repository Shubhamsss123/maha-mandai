services:
  db:
    ports: []
    restart: unless-stopped

  backend:
    command: >
      sh -c "alembic upgrade head && python seed.py && uvicorn app.
      main:app -host 0.0.0.0 -port 8000"
    volumes: []
    restart: unless-stopped

  frontend:
    command: sh -c "npm run build && npm run start"
    volumes: []
    restart: unless-stopped